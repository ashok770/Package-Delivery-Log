# Use the port assigned by the cloud provider
server.port=${PORT:8089}

# Database settings using Environment Variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/deliverylog_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:springuser}
spring.datasource.password=${DB_PASSWORD:spring@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false